<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/src/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Visual de Text</title>
    <style>
        :root {
            --barra: #3F1D0E;
            --fondo-pagina-input: #FEFBF8;
            --primario-primer-color: #B79970;
            --eliminar: #AE303B;
            --estado-pendiente: #C9C2B6;
            --Growl-fallo1: #F0A065;
            --margen-defecto: 1rem;
            --radio-borde: 10px;
        }

        body {
            margin: 0;
            padding: 2rem 2.5rem;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--fondo-pagina-input);
            color: #000000;
        }

        .contenedor-test {
            max-width: 500px;
        }

        .titulo-principal {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #6b6b6b;
            margin: 0 0 2rem;
            text-transform: uppercase;
        }

        .subtitulo {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 1.75rem 0 0.75rem;
        }
    </style>
</head>
<body>

    <main class="contenedor-test">
        <p class="titulo-principal">TEST VISUAL DE TEXT</p>

        <h2 class="subtitulo">Text normal</h2>
        <custom-text label="Nombre"></custom-text>

        <h2 class="subtitulo">Text con error</h2>
        <custom-text label="Correo" error="Campo inválido o requerido"></custom-text>

        <h2 class="subtitulo">Text deshabilitado</h2>
        <custom-text label="Solo lectura" value="No se puede editar" disabled></custom-text>

        <h2 class="subtitulo">Label oculto explícitamente</h2>
        <custom-text label="No se muestra" hide-label></custom-text>
    </main>

    <script type="module" src="/src/js/boundary/main.js"></script>
</body>
</html>
