<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/src/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test visual de Botón Circular</title>
    <link rel="stylesheet" href="/src/assets/styles/variables.css">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--barra);
            background: var(--fondo-pagina-input);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        h2 {
            margin: 1rem 0 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h2>Estado normal</h2>
        <custom-boton-circular></custom-boton-circular>

        <h2>Deshabilitado</h2>
        <custom-boton-circular disabled></custom-boton-circular>

        <h2>Símbolo proyectado</h2>
        <custom-boton-circular aria-label="Agregar producto" texto="+"></custom-boton-circular>

        <h2>Texto y color</h2>
        <custom-boton-circular aria-label="Cerrar" texto="×" color="#B79970"></custom-boton-circular>

        <h2>Imagen</h2>
        <custom-boton-circular aria-label="Agregar producto" icono="/assets/icons/CarritoCompra.png"></custom-boton-circular>
    </main>

    <script type="module" src="/src/js/boundary/main.js"></script>
</body>
</html>
