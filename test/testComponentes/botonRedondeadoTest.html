<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test visual de Botón Redondeado</title>
    <link rel="stylesheet" href="/assets/styles/variables.css">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--barra);
            background: var(--fondo-pagina-input);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        h2 {
            margin: 1rem 0 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h2>Acción principal</h2>
        <custom-boton-redondeado tipo="primary" texto="Completar orden"></custom-boton-redondeado>

        <h2>Acción secundaria</h2>
        <custom-boton-redondeado tipo="secondary" texto="Seguir comprando"></custom-boton-redondeado>

        <h2>Deshabilitado</h2>
        <custom-boton-redondeado texto="No disponible" disabled></custom-boton-redondeado>

        <h2>Con contenido dinámico</h2>
        <custom-boton-redondeado tipo="secondary"><span slot="contenido">Cancelar</span></custom-boton-redondeado>
    </main>

    <script type="module">
        import { registrarComponentes } from '/test/helpers/registrarComponentes.js';
        await registrarComponentes(['/boundary/components/botonRedondeado/botonRedondeadoPlantilla.html']);
    </script>
</body>
</html>
