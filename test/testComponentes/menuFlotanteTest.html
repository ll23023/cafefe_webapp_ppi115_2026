<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test visual de Menú Flotante</title>
    <link rel="stylesheet" href="/assets/styles/variables.css">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--barra);
            background: var(--fondo-pagina-input);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        h2 {
            margin: 1rem 0 0;
            font-size: 1.1rem;
        }

        custom-menu-flotante {
            position: static;
            top: auto;
            right: auto;
            z-index: auto;
        }
    </style>
</head>
<body>
    <main>
        <h2>Sin sesión iniciada</h2>
        <custom-menu-flotante></custom-menu-flotante>

        <h2>Sesión iniciada</h2>
        <custom-menu-flotante usuario="Mil"></custom-menu-flotante>

        <h2>Con contenido dinámico</h2>
        <custom-menu-flotante usuario="Mil">
            <p slot="contenido">Sesión activa desde hoy.</p>
        </custom-menu-flotante>
    </main>

    <script type="module">
        import { registrarComponentes } from '/test/helpers/registrarComponentes.js';
        await registrarComponentes(['/boundary/components/menuFlotante/menuFlotantePlantilla.html']);
    </script>
</body>
</html>
