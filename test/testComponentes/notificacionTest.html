<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test visual de Notificación</title>
    <link rel="stylesheet" href="/assets/styles/variables.css">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--barra);
            background: var(--fondo-pagina-input);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        h2 {
            margin: 1rem 0 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h2>Notificación de éxito</h2>
        <custom-notificacion texto="Cambios guardados" duracion="60000"></custom-notificacion>

        <h2>Notificación de fracaso</h2>
        <custom-notificacion tipo="fracaso" texto="No se pudo completar la operación" duracion="60000"></custom-notificacion>

        <h2>Con contenido dinámico</h2>
        <custom-notificacion tipo="fracaso" duracion="60000"><strong slot="contenido">Revisa los datos ingresados.</strong></custom-notificacion>
    </main>

    <script type="module" src="/boundary/main.js"></script>
</body>
</html>
