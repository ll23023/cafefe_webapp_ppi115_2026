<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test visual de Checkbox</title>
    <link rel="stylesheet" href="/assets/styles/variables.css">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--barra);
            background: var(--fondo-pagina-input);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        h2 {
            margin: 1rem 0 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h2>Sin seleccionar</h2>
        <custom-checkbox label="Recibir novedades"></custom-checkbox>

        <h2>Seleccionado</h2>
        <custom-checkbox label="Guardar preferencia" checked></custom-checkbox>

        <h2>Deshabilitado</h2>
        <custom-checkbox label="Opción no disponible" disabled></custom-checkbox>

        <h2>Seleccionado y deshabilitado</h2>
        <custom-checkbox label="Preferencia fija" checked disabled></custom-checkbox>

        <h2>Con contenido dinámico</h2>
        <custom-checkbox><span slot="contenido">Usar contenido del slot</span></custom-checkbox>
    </main>

    <script type="module" src="/boundary/main.js"></script>
</body>
</html>
