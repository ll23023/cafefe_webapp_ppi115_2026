<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/src/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test visual de Barra Inferior</title>
    <link rel="stylesheet" href="/src/assets/styles/variables.css">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--barra);
            background: var(--fondo-pagina-input);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        h2 {
            margin: 1rem 0 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h2>Barra con acciones</h2>
        <custom-barra-inferior texto="Total: $22.50" texto-secundario="Seguir comprando" texto-primario="Finalizar"></custom-barra-inferior>

        <h2>Con contenido dinámico</h2>
        <custom-barra-inferior texto="Total: $8.00" texto-secundario="Volver" texto-primario="Pagar">
            <span slot="contenido">2 productos</span>
        </custom-barra-inferior>
    </main>

    <script type="module" src="/src/js/boundary/main.js"></script>
</body>
</html>
