<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Cafefe</title>
    <link rel="stylesheet" href="../assets/styles/main.css">
</head>

<body class="login-fondo">

    <main class="login-panel">
         <img class="login-logo" src="../assets/images/cafefeLogo.png" alt="Logo Cafefe">

        <form class="login-form">
            <custom-text 
                label="Usuario" 
                name="usuario" required>
            </custom-text>
            <custom-text 
                label="Contraseña" 
                name="contrasena" 
                placeholder="contraseña" 
                type="password" required>
            </custom-text>

            <div class="login-acciones">
                <custom-checkbox 
                    label="Recordarme" 
                    name="recordarme">
                </custom-checkbox>
                <custom-boton-redondeado 
                    texto="Ingresar">
                </custom-boton-redondeado>
            </div>
        </form>

    </main>

    <script type="module" src="../boundary/main.js"></script>
</body>
</html>
